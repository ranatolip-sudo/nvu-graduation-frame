<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NVU Graduation Frame</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#08172b;color:#fff}
body{display:flex;justify-content:center;padding:18px}
.app{width:min(100%,900px);text-align:center}
h1{margin:4px 0 6px;font-size:clamp(22px,5vw,34px)}
.sub{margin:0 0 16px;color:#d8ddea;font-size:14px}
.stage{width:100%;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 12px 35px #0008}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 8px}
button,.file-label{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
.file-label{background:#d6a64a;color:#07162a}
button{background:#fff;color:#07162a}
button:disabled{opacity:.45;cursor:not-allowed}
input{display:none}
.tip{font-size:13px;color:#c9d0dc;margin-top:8px;line-height:1.5}
#status{min-height:20px;font-size:13px;color:#e7c57c;margin-top:6px}
</style>
</head>
<body>
<main class="app">
<h1>NVU Graduation 2026</h1>
<p class="sub">Choose your photo, move or zoom it inside the frame, then download.</p>

<div class="stage">
<canvas id="canvas" width="1456" height="819"></canvas>
</div>

<div class="controls">
<label class="file-label" for="photoInput">📷 Choose Photo</label>
<input id="photoInput" type="file" accept="image/*" capture="environment">
<button id="download" disabled>⬇️ Download Photo</button>
<button id="reset" disabled>↺ Reset</button>
</div>
<div id="status">Loading frame…</div>
<div class="tip">On your phone: drag the photo to move it. Pinch with two fingers to zoom.</div>
</main>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{alpha:false});
const input=document.getElementById('photoInput');
const download=document.getElementById('download');
const reset=document.getElementById('reset');
const status=document.getElementById('status');

const frame=new Image();
frame.src='frame.png';

let photo=null, scale=1, baseScale=1, x=712, y=338;
let pointers=new Map(), lastMid=null, lastDist=0;

const hole={cx:712.5,cy:338.5,rx:250,ry:225};

function coverScale(img){
  return Math.max((hole.rx*2)/img.width,(hole.ry*2)/img.height);
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(frame,0,0,canvas.width,canvas.height);
  if(photo){
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(hole.cx,hole.cy,hole.rx,hole.ry,0,0,Math.PI*2);
    ctx.clip();
    const w=photo.width*baseScale*scale, h=photo.height*baseScale*scale;
    ctx.drawImage(photo,x-w/2,y-h/2,w,h);
    ctx.restore();
  }
}
frame.onload=()=>{status.textContent='Choose a photo to start.';draw()};
frame.onerror=()=>{status.textContent='Please upload the frame file as frame.png in this repository.'};

input.onchange=()=>{
  const file=input.files&&input.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  const im=new Image();
  im.onload=()=>{
    photo=im;
    baseScale=coverScale(im);
    scale=1;
    x=hole.cx;y=hole.cy;
    download.disabled=false;reset.disabled=false;
    status.textContent='Photo ready — move or zoom it if needed.';
    draw();
    URL.revokeObjectURL(url);
  };
  im.src=url;
};

reset.onclick=()=>{
  if(!photo)return;
  baseScale=coverScale(photo);scale=1;x=hole.cx;y=hole.cy;draw();
};

function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function mid(a,b){return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
function canvasPoint(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
}
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,e);
  if(pointers.size===2){
    const arr=[...pointers.values()];
    lastDist=dist(arr[0],arr[1]);lastMid=mid(arr[0],arr[1]);
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!photo||!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,e);
  const arr=[...pointers.values()];
  if(arr.length===1){
    const p=canvasPoint(e);
    const prev=pointers.get(e.pointerId)._p;
    if(prev){x+=p.x-prev.x;y+=p.y-prev.y}
    pointers.get(e.pointerId)._p=p;
  }else if(arr.length>=2){
    const d=dist(arr[0],arr[1]);
    const m=mid(arr[0],arr[1]);
    if(lastDist){
      scale=Math.max(.35,Math.min(5,scale*d/lastDist));
      const r=canvas.getBoundingClientRect();
      x+=(m.x-lastMid.x)*canvas.width/r.width;
      y+=(m.y-lastMid.y)*canvas.height/r.height;
    }
    lastDist=d;lastMid=m;
  }
  draw();
});
canvas.addEventListener('pointerup',e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2){lastDist=0;lastMid=null}
});
canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));

download.onclick=()=>{
  if(!photo)return;
  canvas.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='NVU-Graduation-2026.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },'image/png');
};
</script>
</body>
</html>
